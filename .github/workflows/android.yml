name: FEHA AI APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'FEHA_AI_STEP02_FINAL.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project ZIP
        run: |
          unzip -o FEHA_AI_STEP02_FINAL.zip -d project
          find project -name settings.gradle.kts -print

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDirectDebug assemblePlayDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FEHA-AI-APKs
          path: project/**/app/build/outputs/apk/**/*.apk
